<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أودْوير ستور // ODDWARE Store</title>
  <meta name="description" content="متجر عصري لتحميل التطبيقات، الأدوات الاحترافية، والألعاب الأصلية لويندوز ولينكس وماك وأندرويد وآيفون." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%236366F1'/%3E%3Cstop offset='100%25' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 22h24v20H20z' rx='6' fill='%23ffffff' fill-opacity='0.95'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%236366F1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/fonts.css?v=3.3.0" />
  <link rel="stylesheet" href="/css/style.css?v=3.4.5" />
  <link rel="stylesheet" href="/css/responsive.css?v=3.4.5" />
</head>
<body>
  <!-- WordPress-Style Top Admin Bar (Strictly hidden for guests & regular members; rendered ONLY when role === 'admin') -->
  <div id="adminTopBar" class="admin-topbar" style="display:none;"></div>

  <!-- Optional Kinetic Ticker Bar (Auto-enabled on Neo-Brutalist theme or toggleable from CPanel) -->
  <div id="tickerSlot"></div>

  <!-- Optional Admin Announcement Banner Plugin Slot -->
  <div id="pluginAlertSlot"></div>

  <!-- Sleek Modern Translucent Header -->
  <header class="site-header">
    <div class="shell header-inner">
      <a href="#vault" class="brand" id="brandHomeLink">
        <div class="brand-mark">Ø</div>
        <div class="brand-text">
          <span class="brand-name" id="brandNameEl">أودْوير ستور</span>
          <span class="brand-sub" id="brandSubEl">متجر التطبيقات والألعاب</span>
        </div>
      </a>

      <div class="header-controls" id="headerControls"></div>
    </div>
  </header>

  <!-- Main Storefront Viewport -->
  <main id="appRoot" class="shell"></main>

  <!-- Clean Minimal Visitor Footer (Zero server/hardware leaks) -->
  <footer class="site-footer">
    <div class="shell footer-inner" id="footerContainer"></div>
  </footer>

  <!-- Lightbox & QR Modal -->
  <div class="modal-backdrop" id="utilityModal">
    <div class="modal-window" style="width:min(540px,100%);">
      <div class="modal-header">
        <strong id="utilityModalTitle">معاينة</strong>
        <button class="icon-close-btn" id="closeUtilityBtn" type="button">✕</button>
      </div>
      <div class="modal-body" id="utilityModalBody" style="align-items:center;text-align:center;"></div>
    </div>
  </div>

  <!-- Unified Sign In / Register Account Modal (First user automatically claims Admin!) -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal-window" style="width:min(460px,100%);">
      <div class="modal-header">
        <strong id="authModalTitle">تسجيل الدخول</strong>
        <button class="icon-close-btn" id="closeAuthBtn" type="button">✕</button>
      </div>
      <div class="modal-body" id="authModalBody"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-banner" id="toastEl"></div>

  <script type="module" src="/js/app.js?v=3.3.0"></script>
</body>
</html>
